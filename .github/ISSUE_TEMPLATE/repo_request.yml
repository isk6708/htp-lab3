name: '🗒️ Repository Request'
description: 'Request a new repository.'
title: '🗒️ Repository Request: '
labels:
  - 'repo-request'
  - 'issue-ops'
assignees:
  - isk6708
projects:
  - 'isk6708/4'
body:
  - type: input
    id: name
    attributes:
      label: 'Repository Name'
      description: 'Enter the formal repository name using your team style guide (e.g., ProjectName-Service or LabModule).'
      placeholder: 'ProjectJpj-API'
    validations:
      required: true
  - type: dropdown
    id: department
    attributes:
      label: 'Department'
      description: 'Pick your department. It will be used as a prefix for the repository name.'
      multiple: false
      options:
        - project jpj
        - project imi
        - project heitech
      default: 0
    validations:
      required: true
